eee"}},"type":"Hr","namespace":"dash_html_components"},{"props":{"children":[{"props":{"children":"Debugging","style":{"fontSize":"11px","fontWeight":"bold","color":"#888","textTransform":"uppercase","letterSpacing":"0.5px","marginBottom":"6px","cursor":"pointer","userSelect":"none"}},"type":"Summary","namespace":"dash_html_components"},{"props":{"options":[{"label":" Show IEM footprint","value":"show"}],"value":[],"style":{"fontSize":"13px","marginTop":"6px"},"id":"iem-bbox-toggle"},"type":"Checklist","namespace":"dash_core_components"},{"props":{"children":null,"id":"map-view-readout","style":{"fontSize":"12px","fontFamily":"monospace","color":"#555","marginTop":"8px"}},"type":"Div","namespace":"dash_html_components"},{"props":{"children":[{"props":{"type":"number","placeholder":"zoom","min":1,"max":18,"step":1,"style":{"width":"56px","fontSize":"12px"},"id":"map-zoom-input"},"type":"Input","namespace":"dash_core_components"},{"props":{"type":"text","placeholder":"lat, lon","style":{"width":"120px","fontSize":"12px"},"id":"map-center-input"},"type":"Input","namespace":"dash_core_components"},{"props":{"children":"Apply","id":"map-view-apply","n_clicks":0,"style":{"fontSize":"12px"}},"type":"Button","namespace":"dash_html_components"}],"style":{"display":"flex","gap":"4px","alignItems":"center","marginTop":"6px"}},"type":"Div","namespace":"dash_html_components"}],"open":false},"type":"Details","namespace":"dash_html_components"}],"id":"debug-menu-content","style":{"display":"none"}},"type":"Div","namespace":"dash_html_components"}],"id":"tools-panel","style":{"flex":"0 0 32%","width":"32%","height":"100vh","background":"rgba(255,255,255,0.97)","borderLeft":"1px solid rgba(0,0,0,0.15)","boxShadow":"-3px 0 8px rgba(0,0,0,0.10)","overflowY":"auto","padding":"0 12px 12px 12px","boxSizing":"border-box"}},"type":"Div","namespace":"dash_html_components"}],"style":{"display":"flex","height":"100vh","overflow":"hidden"}},"type":"Div","namespace":"dash_html_components"},{"props":{"children":[{"props":{"id":"docs-payload","data":{"order":["about","video","summary","kpis","data","links"],"text":{"about":"# Virtual nitrate sensors for Iowa\n\nIowa's rivers carry dangerous nitrate from fertilizer runoff. Above **10 mg\u002fL** the water is deemed unsafe to drink, and the sensor network that measures it is sparse, expensive, and shrinking under budget cuts — most of the state is simply unmonitored.\n\nThis tool aims to answer the question a missing sensor would: **on a given day, at a place with no instrument, how much nitrate is in the water and is it over the limit?** It uses only public data — weather, satellite land cover, and soil nitrogen surplus — so it works anywhere in the state.\n\n## Try it\n\n1. Choose **Pin drop** in the Selection panel, then click anywhere on an Iowa waterway.\n2. Pick a year and press **Run forecast**.\n3. Drag the **β slider** to trade catching more violations against raising more false alarms.\n\nThe pin snaps to the nearest mapped stream reach, and a dashed line shows where it moved from. The forecast describes that reach's drainage basin, not the exact point you clicked.\n\nThis was completed at the Summer 2026 Erdos Institute Data Science Bootcamp. Team members: [Isaac Martin](https:\u002f\u002fweb.ma.utexas.edu\u002fusers\u002fikmartin\u002f), Rajpreet Kaur, and Erin Bevilacqua. Ongoing work is occurring in a separate repo; this tool remains a static representation of our original work and a proof-of-concept.\n\n## How well does it work?\n\nEvaluated on **basins the model never saw in training**, the honest test for a location with no sensor:\n\n| | |\n|---|---|\n| Ranks violation days | **2.75× better than chance** (average precision 0.71, against a 26% base rate) |\n| Catches violations | **90%** of them, with 54% of alarms false, at the default β = 2 |\n| Predicts concentration | **R² 0.43**, typical error 4.2 mg\u002fL |\n\nTrained on 81 sensors and 158,215 sensor-days, validated across 20 hydrologically independent basin families.\n\n## What it is not\n\nIt is not a substitute for a physical sensor. It is weakest at ranking one basin's *overall* level against another's, and strongest at timing *when* nitrate rises within a basin. Where the realistic alternative is no information at all, that is still a useful trade.\n\nIt also assumes stringent data restrictions: it does not make use of the data provided by physical sensors in the water at prediction time. Ongoing work aims to build on this proof-of-concept to produce a robust nationwide virtual nitrate model intended to supplement an existing in-situ nitrate sensor network.\n\n## Under the hood\n\nEverything you are looking at runs in your browser. All 16,760 stream reaches were delineated ahead of time and their features precomputed; the gradient-boosted trees are repacked into a binary blob and walked in JavaScript. The model is light enough that this barely affects performance (which itself is somewhat surprising). The page itself is a static snapshot of the project as it existed on 2026-07-30.\n\nOngoing work is occurring at this [forked repo](https:\u002f\u002fgithub.com\u002fikmartin\u002fsustag), and we aim to deploy those (heftier) models on a dedicated server.\n\nRead the [executive summary](executive_summary.md) for the full account, [kpis.md](kpis.md) for how the scores are defined, or the [source on GitHub](https:\u002f\u002fgithub.com\u002fErdos-Projects\u002fsummer26-sustainability-of-agriculture).\n","video":"A five-minute walkthrough of the project: the problem, how the drainage basins and covariates are built, what the models do, and where they succeed and fail.\n\n**The numbers quoted in the video are out of date**, as explained in the [`Results & metrics`](kpis.md) section. Here are our updated claims:\n- The models now have reasonably good `between-site R²` scores, and hence are capable of ranking unseen basins relative to one another.\n- The regression model explains 43% of daily nitrate variation, approaching a good signal.\n- The classification model catches 90% of violation days at a 54% false alarm rate.\n\nEverything else in the presentation — the motivation, the data pipeline, and the reasoning behind the feature design — still describes the project as built.\n","summary":"# Executive Summary\n\n**Project members:** Erin Bevilacqua, Rajpreet Kaur, Isaac Martin\n\n**Github Repo:** \u003chttps:\u002f\u002fgithub.com\u002fErdos-Projects\u002fsummer26-sustainability-of-agriculture\u003e\n\n**Deployed Widget:** \u003chttps:\u002f\u002ferdos-projects.github.io\u002fsummer26-sustainability-of-agriculture\u002f\u003e\n\n**Project Objective:** Iowa grows 2.5 billion bushels of corn a year, which demands heavy nitrogen fertilizer; the excess leaches into rivers as nitrate, a Group 2A carcinogen. Iowa's drinking water routinely exceeds the 10 mg\u002fL federal limit — far above the 1–2 mg\u002fL background level and the 3 mg\u002fL threshold now linked to elevated cancer risk — a likely contributor to the state's rising cancer rate. Real-time nitrate sensors are sparse, costly, and shrinking under budget cuts, leaving utilities, regulators, and farmers blind across most of the state. We ask: **can we predict nitrate concentration and violation risk at any Iowa location from publicly available weather and land-use data alone, with no physical sensor?**\n\n**Data preparation and computing workflow:** \nWe filtered 162 candidate sensors to 83 high-quality sites, of which 81 carry enough history to train on (158,215 daily nitrate records). For each, we computed and hand-validated a drainage basin using one of three distinct methods, then stitched three gridded layers onto it: annual satellite crop cover, annual soil nitrogen surplus, and daily weather. Feature engineering was a major effort, with three findings driving the design:\n\n- Proximity dominates — land near a sensor matters far more than the basin's outer reaches, so we bucketed features by distance and weighted them by exponential decay toward the sensor.\n- Geography is a strong proxy — latitude\u002flongitude and basin geometry proved surprisingly predictive, likely standing in for unmeasured local factors like nearby livestock operations.\n- Seasonality is real, leakage is a trap — violations are seasonal beyond weather alone (sine\u002fcosine terms helped), and because upstream basins nest inside downstream ones, we held whole basin families together across the train\u002ftest split to prevent spatial leakage.\n\n**Statistical Validation and KPIs:** \nTwo early dead ends shaped our approach. First, classical time-series forecasting (e.g., Holt-Winters) is nonsensical for our target; it needs a site's own history, which a virtual site lacks. Second, per-site models underperformed even a dummy-mean baseline (negative test R²) for want of data. Pooling all sites into one XGBoost model was the unlock — untuned, it already reached 0.24 R² (regression) and 0.51 PR-AUC (classification) on unseen sites, the benchmark the tuned pipeline was measured against.\n\nFinal tuned results below, reported using CV designed to prevent leakage from nested basins: \n\n- **Classification (violation flagging):** ROC-AUC 0.87, PR-AUC 0.71 against a 25.8% base rate (2.75× better than chance), and per-site AUC 0.90 — excellent at timing when a basin spikes. A Brier score of 0.123 (vs. a 0.191 base-rate floor, a 36% skill improvement) confirms well-calibrated probabilities. Tuned toward recall, it catches 90% of violations at a 54% false-discovery rate, with a knob to trade recall against precision.\n\n- **Regression (concentration):** R² ≈ 0.43 (up from the 0.24 baseline), ~4.2 mg\u002fL typical error. To account for the high variability in average site nitrate values, we report two mean-normalized scores: within-basin R² (0.42) calculates R² after subtracting a site's mean from both the prediction and the actual, and between-basin R² (0.40) compares the predicted and actual site means. The second was long the weaker of the two — the regressor could tell you when a basin would spike but not how bad an unseen basin was in absolute terms. Adding long-run land-use composition roughly doubled it, from 0.20, which is what moved the headline R² as well.\n\nThese numbers are the deployed `light_CLF` and `light_REG` models — the pair restricted to the feature set a browser can assemble at an arbitrary point, and therefore exactly what the widget runs. They were retrained on 2026-07-30 with the long-run composition block; the full `recipe_*` models have not been, so they currently score *below* the light pair (PR-AUC 0.695, R² 0.380). See [`kpis.md`](kpis.md) for both.\n\n**Statistical tests and deployment implications:** \nAn F-test confirmed nitrate's seasonality survives controlling for rainfall seasonality, ruling out a naive \"high in June\" shortcut. Gain- and permutation-based importance agree on the backbone: statewide daily nitrate, sensor location\u002fgeometry, and near-field corn. \n\nKey limitations: a sparse sensor fleet, annual crop\u002fsoil snapshots that miss within-season change, and extrapolation risk at unfamiliar basins — and nitrate ultimately depends on more than weather and crops. Natural next steps: point-source pollution data (livestock manure, which location may be proxying for), soil\u002ftile-drainage data, fertilizer timing, and graph models exploiting hydrological network structure.\n\nThe work is deployed as a public web widget at \u003chttps:\u002f\u002ferdos-projects.github.io\u002fsummer26-sustainability-of-agriculture\u002f\u003e: drop a pin anywhere in Iowa and it snaps to the nearest mapped stream reach, whose drainage basin and ~50-feature set were computed in advance. It then scores the models entirely in-browser to return predicted-nitrate and violation-probability curves — no local history needed — with a tunable recall\u002fprecision knob.\n\n**Executive Impact:**\nNitrate predictions let three groups act sooner and more precisely than the current sparse sensor network allows. Water utilities can begin treatment before a spike hits rather than reacting after the fact. Regulatory agencies can target monitoring and remediation dollars toward high-risk unmonitored locations rather than spreading resources evenly. Farmers can time fertilizer application around forecasted rain to reduce runoff. The model is not a substitute for physical sensors in regulatory compliance contexts, but in a state where budget cuts mean the realistic alternative at most locations is no information at all, an imperfect, well-calibrated prediction represents a substantial upgrade in situational awareness.","kpis":"# KPIs\n\nPrimary KPI: **can we flag a nitrate-violation day (≥ 10 mg\u002fL) at a location with no sensor?** This is the classification (CLF) task.\n\nSecondary KPI: Same question but with a regression target, **can we predict nitrate concentration (mg\u002fL) timeseries at unseen sites?** This is the regression (REG) task.\n\nWe discuss our results below, comparing them to the figures quoted in our presentation video. Below that are sections describing our cross-validation strategy and the definitions for all the metrics we use to score our models.\n\n# Results\n\nHere are tables of our metrics, presented alongside the figures quoted in our presentation. The comparison is unfair in favor of the older models in two ways:\n- The default cross-validation technique at the time of the video was LOSO (optimistic) whereas the figures we report here default to LOFO (conservative). See the CV section below for a full discussion.\n- The figures we report in this widget come from our `light_REG` and `light_CLF` models. These were optimized specifically to run in-browser, but sacrifice some performance relative to what is possible.\n\nNonetheless, our light models still vastly outperform the old models:\n\n**Regression — nitrate concentration (mg\u002fL):**\n\n|  | LOSO R² | LOFO R² | between-site R² | within-site R² | macro-R² | site AP | captured |\n|:---|---:|---:|---:|---:|---:|---:|---:|\n| At time of video: | 0.3800 | 0.3280 | 0.2094 | 0.4187 | 0.2445 | — | — |\n| Widget's `light_REG`: | **0.4727** | **0.4251** | **0.3959** | **0.4212** | **0.2768** | **0.493** | **0.351** |\n| ∆ improvement: | **+0.0927** | **+0.0971** | **+0.1865** | ≈ equal | **+0.0323** | — | — |\n\n**Classification — violation ≥ 10 mg\u002fL:**\n\n|  | LOSO AUC | LOFO AUC | LOFO PR-AUC | Lift vs base | between-rate R² | macro AUC | site AP | captured |\n|:---|---:|---:|---:|---:|---:|---:|---:|---:|\n| At time of video: | 0.8358 | 0.8066 | 0.6249 | 2.38× | 0.2201 | 0.8938 | — | — |\n| Widget's `light_CLF`: | **0.8768** | **0.8702** | **0.7105** | **2.75×** | **0.4980** | **0.8983** | **0.614** | **0.531** |\n| ∆ improvement: | **+0.0410** | **+0.0636** | **+0.0856** | **+0.38×** | **+0.2779** | ≈ equal | — | — |\n\nBlank cells are metrics that did not exist when that model was scored. Definitions of every metric can be found in the sections below.\n\nThese gains were achieved by many small optimizations including\n- further improvements to basin accuracy\n- more feature engineering\n- better XGBoost tuning protocols.\n\n## Interpretation of results\nIn words:\n- If you're willing to tolerate a lot of false alarms, the classifier is pretty good at identifying violation days. \n- The actual predictions the regressor produces shouldn't be trusted, but it can be used to identify trends. \n- Both the classifier and the regressor could be used to identify a shortlist of unmonitored, potentially dangerous sites to then go and field test prior to sensor installation.\n\nIn numbers:\n- `LOFO PR-AUC at 0.71:` The main metric. This measures the classifier's ability to pick out the days that are true positives. It should be compared to the base violation rate, which is 0.2584 in this case, so the classifier is 2.75× better than chance at identifying violation days (on average across all thresholds). At our default threshold choice, the model can be trusted to detect **90% of actual violation days anywhere in Iowa**, but 54% of the alarms it raises will be false (see the β-table below). At more aggressive tuning, you catch 97% of true positives at a 64% false alarm rate.\n- `LOFO R²:` Our regression model explains 43% of day-to-day variation at unseen sites. Don't trust it for precise nitrate values, but it is a good indicator of trends.\n- `between-site + site AP + captured:` Both the classifier and the regressor are good at picking out particularly dangerous sites; the classifier is better. You can use them to identify a shortlist of potentially unmonitored dangerous sites.\n\n# Cross-validation\n\nWe evaluate our methods with various scores (see below) under a few different cross-validation schemes:\n- **LOFO -- Leave One FAMILY Out:** primary CV technique, splits train\u002ftest based on hydrological connection. A hydrologically connected family of sites is always kept together across the split. Most robust to data leakage. Is a conservative metric. All metrics listed are this unless otherwise specified with a prefix. We actually use GroupKFold with $k = 5$ for this, 85\u002f15.\n- **LOSO -- Leave One Site Out:** secondary CV technique, performs train\u002ftest split without reference to hydrological connection. It still never splits data from a site across train\u002ftest; sites are highly autocorrelated so this essentially trivializes the problem -- you train a model to memorize each site and then learn to identify which site it is looking at from the static geographic features. Also GroupKFold with $k = 5$, again aiming for an 85\u002f15 split.\n- **True_LOFO:** Same thing as LOFO but we actually hold one whole family out for testing rather than doing GroupKFold.\n- **LODO_d -- Leave One Distance family Out:** A mix between True_LOFO and LOSO, hold out one site for testing, train on everything which is either not connected to the site OR is at least $d$ meters away by flow distance.\n\n# Metrics for CLF (violation ≥ 10 mg\u002fL)\n\nHeadline pair is **`lofo_prauc_lift`** + **`lofo_auc`**. The former is **`prauc`** below divided by the base-violation rate — how much the CLF model outperforms coin-flipping. Formulas and descriptions are given below. Note these definitions are independent of CV technique; for most we only track `lofo_` values, but we track `loso_auc` as a comparison point to `lofo_auc`.\n\nTake the pooled table of (truth y, prediction p, site g) over all 158,215 rows and 81 sites, in 20 basin families.\n\n##### `prauc` — \"of the rows the model flags hardest, how many are real?\"\nAverage precision: sweep every threshold and integrate precision against the recall it buys, so a rare positive class is never rewarded for the true negatives it gets for free.\n\n$$\n\\mathrm{AP} = \\sum_k \\big(R_k - R_{k-1}\\big)\\, P_k, \\qquad P_k = \\mathrm{Prec}(\\tau_k),\\ R_k = \\mathrm{TPR}(\\tau_k)\n$$\n\n##### `prauc_lift` — \"how much better than guessing?\"\nAverage precision divided by the base rate, which is what a random ranker scores. Imbalance-normalized, so it reads the same way at any prevalence — but bounded above by $1\u002f\\pi$ (3.88 here), so it is not comparable across cohorts whose base rates differ.\n\n$$\n\\text{lift} = \\mathrm{AP}\u002f\\pi, \\qquad \\pi = \\tfrac{1}{N}\\sum_i y_i\n$$\n\n##### `auc` — \"does a random violation outrank a random non-violation?\"\nROC-AUC: the probability that a randomly drawn positive row scores above a randomly drawn negative one, integrated over the entire ranking including thresholds nobody would deploy.\n\n$$\n\\mathrm{AUC} = \\Pr\\big(p_i \u003e p_j \\,\\big|\\, y_i = 1,\\ y_j = 0\\big) = \\int_0^1 \\mathrm{TPR}\\, d(\\mathrm{FPR})\n$$\n\n##### `br2 (between_rate_r2)` — \"which basins are the bad ones?\"\nCollapse each site to its observed violation rate and its mean predicted probability, then take R² over those 81 points, unweighted by row count.\n\n$$\nR^2_{\\text{between-rate}} = 1 - \\frac{\\sum_{s\\in\\mathcal S}\\big(\\bar y_s - \\bar p_s\\big)^2}{\\sum_{s\\in\\mathcal S}\\big(\\bar y_s - \\bar{\\bar y}\\big)^2}, \\qquad \\bar y_s = \\tfrac{1}{n_s}\\!\\!\\sum_{i:,s(i)=s}\\!\\! y_i\n$$\n\n##### `macro_auc` — \"how well does it time violations at a typical site?\"\nROC-AUC computed separately on each site's own rows, then the median across sites — one site one vote, so unlike `auc` it is not dominated by long-record sites. Sites where AUC is undefined (no violations, or no non-violations) drop out of the median rather than counting as zero.\n\n$$\n\\text{macro-AUC} = \\operatorname*{median}_{s} \\mathrm{AUC}_s\n$$\n\n##### `f2 (recall_at_f2)` — \"at the shipped alarm setting, what share of violations do we catch?\"\nPick the threshold that maximizes $F_\\beta$ at $\\beta = 2$ (recall weighted $4\\times$ precision, the deployed operating point) and read off the true-positive rate there.\n\n$$\n\\tau_2 = \\operatorname*{arg\\,max}_\\tau \\frac{5\\,\\mathrm{Prec}(\\tau)\\,\\mathrm{TPR}(\\tau)}{4\\,\\mathrm{Prec}(\\tau) + \\mathrm{TPR}(\\tau)}\\, \\qquad \\text{recall@}F_2 = \\mathrm{TPR}(\\tau_2)\n$$\n\n##### `fdr_at_f2` — \"at that same setting, what share of the alarms are false?\"\nThe complement of precision at the identical $\\tau_2$, which is why it must always be quoted beside f2 — recall bought by lowering the threshold shows up here as cost.\n\n$$\n\\mathrm{FDR@}F_2 = 1 - \\mathrm{Prec}(\\tau_2) = \\frac{\\mathrm{FP}(\\tau_2)}{\\mathrm{TP}(\\tau_2) + \\mathrm{FP}(\\tau_2)}\n$$\n\n##### `brier` — \"when it says 30%, does it happen 30% of the time?\"\nMean squared error of the predicted probability against the 0\u002f1 outcome — a calibration score, not a ranking one, so unlike prauc and auc it moves when the probabilities are shifted even if the ordering is untouched. Lower is better and $0$ is perfect, but the number is unreadable alone: the reference point is the climatology forecast $p_i \\equiv \\pi$, which scores $\\pi(1-\\pi) = 0.258 \\times 0.742 = 0.1914$ on this cohort. That gives the skill score $\\mathrm{BSS} = 1 - \\mathrm{Brier}\u002f\\pi(1-\\pi)$, so `recipe_CLF`'s 0.1288 is a BSS of 0.33 (`light_CLF`'s 0.1285 likewise).\n\n$$\n\\mathrm{Brier} = \\frac{1}{N}\\sum_i \\big(p_i - y_i\\big)^2\n$$\n\n##### `base` — \"how often does a violation happen at all?\"\nThe pooled violation rate. Not a score in itself: it is the reference every other CLF number is read against — the floor `prauc` is divided by, the $\\pi(1-\\pi)$ in the Brier skill score, and the prevalence at which `fdr` is quoted.\n\n$$\n\\pi = \\tfrac{1}{N}\\sum_i y_i = 0.258\n$$\n\n\n##### `site_ap` — \"are the worst basins at the top of the list?\"\nA measure of the model's accuracy in ranking the top 10% worst sites (highest average nitrate). Same as the formula described in detail below for the regression target, but here we rank sites by *violation rate* rather than average nitrate concentration.\n\n##### `captured` — \"how much of the achievable badness would a shortlist find?\"\nCompare the badness of the sites predicted to be worst to the badness of the actual worst sites. Take the $k$ sites the model ranks worst, call them $\\mathcal P$, and let $\\mathcal T$ be the actual $k$ worst sites. Let $\\bar y_s$ be the average violation rate of site $s$ (actual, not predicted) and let $m$ be the average violation rate across all sites. Then calculate\n\n$$\n\\text{captured} = \\frac{\\sum_{s \\in \\mathcal P} \\bar y_s - m}{\\sum_{s \\in \\mathcal T} \\bar y_s - m}.\n$$\n\n0 is a random shortlist, 1 the best achievable.\n\n# Metrics for REG (nitrate mg\u002fL)\nThese are more self-explanatory. The primary one is `lofo_r2` which captures the same thing as `rmse`. The triple `between_r2`, `within_r2` and `macro_r2` are for measuring inter-site dynamics in various ways.\n\n##### `lofo_r2` — \"how much of the total nitrate variance is explained?\"\nOrdinary R² over all 158,215 pooled rows against the global mean, so it is row-weighted and long-record sites dominate it.\n\n$$\nR^2 = 1 - \\frac{\\sum_i (y_i - p_i)^2}{\\sum_i (y_i - \\bar y)^2}\n$$\n\n##### `loso_r2` — \"how much does hydrological leakage flatter us?\"\nThe same R² on the LOSO out-of-fold vector instead of the LOFO one, and for the same reason always the higher of the two. For the deployed regressor: 0.473 LOSO against 0.425 LOFO.\n\n##### `rmse` — \"how far off is a typical prediction, in mg\u002fL?\"\nThe same error as lofo_r2 but left in the target's units instead of normalized by variance, which makes it comparable across cohorts where $R^2$ is not. We only record lofo evaluation.\n\n$$\n\\mathrm{RMSE} = \\sqrt{\\frac{1}{N}\\sum_i (y_i - p_i)^2}\n$$\n\n##### `between_r2` — \"which basins are bad?\"\nCollapse every site to two numbers, its mean truth and its mean prediction, then take R² over those 81 points, unweighted by row count:\n\n$$\nR^2_{\\text{between}} = 1 - \\frac{\\sum_s (\\bar y_s - \\bar p_s)^2}{\\sum_s (\\bar y_s - \\bar{\\bar y})^2}\n$$\n\nThis is a measure of the model's ability to rank the magnitude of sites collectively.\n\n##### `within_r2` — \"when does it spike?\"\nBroadcast each site's mean back to its rows and subtract it from both truth and prediction, then take R² on what's left:\n\n$$\nR^2_{\\text{within}} = 1 - \\frac{\\sum_i \\big[(y_i - \\bar y_{s(i)}) - (p_i - \\bar p_{s(i)})\\big]^2}{\\sum_i (y_i - \\bar y_{s(i)})^2}\n$$\n\nMeasures whether, when the site diverges from its mean, the predictions also diverge from their mean, which is what makes it a gauge of the model's spike-detection ability.\n\n##### `macro_r2` — \"how does the typical site do?\"\nCompute R² separately on each site's own rows, then take the median across sites. Sites where R² is undefined (a single row, or zero variance in the truth) drop out of the median rather than counting as zero:\n\n$$\n\\text{macro-}R^2 = \\operatorname*{median}_{s} R^2_s\n$$\n\nSo this is the same as `lofo_r2` but restricted to the median site.\n\n##### `site_ap` — \"are the worst basins at the top of the list?\"\nA measure of the model's accuracy in ranking the top 10% worst sites (highest average nitrate). Order all sites from worst to best (highest to lowest average nitrate) so that site $s_1$ has the highest nitrate average, site $s_2$ the second highest, etc. Now order them by the predicted values produced during the GroupKFold split, so that for a site $s$, $\\ell_{s}$ is its rank as predicted by the model during CV. Then for the actual top offending sites $s_1,...,s_k$, calculate the average:\n\n$$\n\\mathrm{site\\_ap} = \\frac1k \\sum_{i=1}^k \\frac{\\# \\text{worst sites in the predicted top }\\ell_{s_i}}{\\ell_{s_i}}.\n$$\n\nThis is easier to see in a table using the 79 sites which actually appear in training:\n\n| rank i | site | actual (mg\u002fL) | found so far | precision at i |\n|---:|:---|---:|:---:|---:|\n| 1 | WQS0104 | 14.90 | 1\u002f8 | 1.000 |\n| 3 | WQS0054 | 13.95 | 2\u002f8 | 0.667 |\n| 4 | WQS0048 | 12.34 | 3\u002f8 | 0.750 |\n| 7 | WQS0055 | 15.82 | 4\u002f8 | 0.571 |\n| 14 | WQS0043 | 11.11 | 5\u002f8 | 0.357 |\n| 15 | WQS0056 | 16.21 | 6\u002f8 | 0.400 |\n| 16 | WQS0114 | 18.93 | 7\u002f8 | 0.438 |\n| 17 | USGS-05481000 | 10.76 | 8\u002f8 | 0.471 |\n\nFor these values, the average precision is $0.5817$, whereas randomly guessing would give you an average precision of $k\u002fn \\approx 0.1$. In this case, the model is 5.7 $\\times$ better than chance at predicting the top 10%.\n\nNote this is a conservative estimate: when the model is asked to predict WQS0114, the top offending site at $18.93$ mg\u002fL, the worst it has seen is $16.21$ mg\u002fL, and it fails to extrapolate. Every other top 10 site has WQS0114 available in training and the model is able to successfully identify those sites as worse.\n\n##### `captured` — \"how much of the achievable badness would a shortlist find?\"\nCompare the badness of the sites predicted to be worst to the badness of the actual worst sites. Take the $k$ sites the model ranks worst, call them $\\mathcal P$, and let $\\mathcal T$ be the actual $k$ worst sites. Let $\\bar y_s$ be the average nitrate of site $s$ and let $m$ be the average of all averages. Then calculate\n\n$$\n\\text{captured} = \\frac{\\sum_{s \\in \\mathcal P} \\bar y_s - m}{\\sum_{s \\in \\mathcal T} \\bar y_s - m}.\n$$\n\n0 is a random shortlist, 1 the best achievable.\n\n# Deployed operating point (β-table)\n\nWhat actually ships in the widget is a **recall-emphasis knob β**, not a fixed cutoff. For each β, `src\u002fmodels\u002ftune_threshold.py` sweeps the LOFO out-of-fold predictions, picks an optimal threshold $\\tau$, and records the recall\u002fprecision there; the table + base rate are saved along with the model.\n\nHere is the β-table for the classifier in this widget, `light_CLF`. The value of β determines the threshold τ, as well as the recall rate and the false discovery rate (FDR).\n\n| β | τ | recall | FDR |\n|---|---|---|---|\n| 0.5 | 0.489 | 0.525 | 0.271 |\n| 1.0 | 0.251 | 0.736 | 0.388 |\n| **2.0** | **0.077** | **0.903** | **0.540** |\n| 3.0 | 0.047 | 0.947 | 0.598 |\n| 4.0 | 0.030 | 0.970 | 0.642 |\n\nBy default we set **β = 2**, but this can be changed in the forecast section.","data":"# Data Inventory\n\nThis documents all of our data sources and explains how to access them. Below, in the \"Data Story\" section, we describe our process for finding, selecting, cleaning, and processing this data.\n\n## Summary\n\nTwo different resolutions: basin level and global grid level.\n\n- Water data (the nitrate_con targets) and basin GeoDataFrame parquets tied to individual site ids. For this reason we refer to \"sites\" and \"basins\" interchangeably.\n- Weather, Crop, Surplus data all processed and aggregated to a single global grid (boundaries given by `bbox_wgs84` in `src\u002fbuild\u002fpipeline_config.toml`). At runtime, `src.data.access.get_data(site_uid)` grabs relevant data from the global cell ids contained in the basin parquet, so the stitching happens at runtime. This is necessary for the virtual site functionality deployed in the widget.\n\nData is built (after downloading the raw source, see `README.md`) by `make_data.py`, which in turn calls various `_make_*.py` scripts. Note this whole pipeline was originally written by hand, but Claude was used to port it to the Erdos-specified directory structure and to decouple the covariate data from the basin architecture. Not all ported files have been manually reviewed in their entirety, but all tests pass and all old functionality is retained.\n\n## Sources\nSources feeding the pipeline. Acquisition lives in `src\u002fbuild\u002f` (builders + `util\u002f`), raw\nsnapshots in `src\u002fdata\u002fraw\u002f` (gitignored — see download instructions per source). Full\naccess details (URLs, keys, code) are in the *Access Points* section below.\n\n| Source | What | Access | Builder | License \u002f limits |\n|---|---|---|---|---|\n| IWQIS | Iowa nitrate sensor time series (`WQS*`) | bulk CSV, by request | `_make_water.py` | By request (IWQIS \u002f U. Iowa IIHR); not an open API |\n| USGS-NWIS | USGS nitrate gauges (`USGS-*`) | REST API | `_make_water.py` | public domain |\n| NLDI | Drainage-basin delineation (basin0\u002f1\u002f2), and every forecastable reach for the widget | REST API | `_make_basins.py`, `widget\u002fstatic\u002ffetch_basins.py` | public; quota-metered (800 req \u002f ~12 min) |\n| IEM | ~4 km precip Voronoi grid (reference-day geometry) | zip download | `_make_grid.py` | Public (Iowa State U. \u002f IEM); free |\n| gridMET | Daily weather (temp, ET, humidity, solar…) | download | `_make_weather.py` | Public domain (Climatology Lab, U. Idaho) |\n| USDA CDL | Cropland Data Layer (crop classification raster) | CropScape API | `util\u002fclip_crops.py`, `_make_crops.py` | public |\n| N-surplus | Iowa nitrogen-surplus grid (250 m) | static parquet | `util\u002fbuild_source.py`, `_make_surplus.py` | CC BY 4.0 (gTREND, Nature Sci. Data 2026) |\n| NHD | Flowlines & waterbodies (widget overlays) | USGS NHD | `_make_map_overlays.py` | public |\n\n## Access Points\n\n### USGS NWIS (continuous nitrate \u002f water quality — `USGS-*` sites)\n- *Description:* Continuous (sub-daily) nitrate concentration + discharge\u002fstage\u002ftemperature for USGS monitoring stations; the water target for the USGS-prefixed sites.\n- *URL:* https:\u002f\u002fapi.waterdata.usgs.gov\u002f (accessed via the `dataretrieval` package)\n- *Access Method:* `dataretrieval.waterdata` Python client (sets `API_USGS_PAT` env var)\n- *Requires API-Key:* **True** (USGS API token, `api-keys.toml → usgs`)\n\n```python\nimport os\nfrom dataretrieval import waterdata\n\nos.environ[\"API_USGS_PAT\"] = \"\u003cyour USGS API token\u003e\"\ndf = waterdata.get_timeseries(monitoring_location_id=\"USGS-05465500\", parameter_code=\"99133\")  # nitrate\n```\n\n### IWQIS — Iowa Water Quality Information System (nitrate — `WQS*` sites)\n- *Description:* High-frequency nitrate sensor data for Iowa Water Quality stations; the water target for the WQS-prefixed sites.\n- *URL:* https:\u002f\u002fiwqis.iowawis.org\u002f\n- *Access Method:* Must email someone at the IWQIS and request access.\n- *Requires API-Key:* **False**\n\n```python\n# Not an API — the build reads the committed chunked CSV export, not a live endpoint:\nimport pandas as pd\ndf = pd.read_csv(\"src\u002fdata\u002fraw\u002fwater\u002fchunks\u002fiwqis_alldata_chunk1.csv\")\n```\n\n### USGS NLDI — Network-Linked Data Index (basin delineation)\n- *Description:* Upstream drainage-basin polygon for a COMID, via USGS hydrologic network navigation. Source for three of the four delineations `_make_basins.py` computes:\n  - **basin0** — `nwissite\u002f{uid}\u002fbasin`, the authority's own delineation. USGS sites only; the preferred basin wherever it exists (23 of 83 sites).\n  - **basin1** — **the default for everything else.** The sensor is snapped to its *nearest NHD reach* (`snap_comid`, using the `_make_map_overlays.py` flowlines) and that COMID's upstream basin is fetched. Not `\u002fcomid\u002fposition`: that returns the catchment *containing* the point, and NHDPlus mainstem reaches through divergences carry `AreaSqKM = 0`, so a mainstem sensor silently lands in a neighboring tributary's catchment. `WQS0061` is the worked case — 1057 km² (Soldier River) by the snap vs 15.6 km² by containment.\n  - **basin2** — `\u002fcomid\u002fposition` containing catchment, retained as a cross-check only (`flag_area_mismatch_v2`), never auto-selected.\n- *URL:* https:\u002f\u002fapi.water.usgs.gov\u002fnldi\u002flinked-data\n- *Access Method:* HTTP REST (GeoJSON)\n- *Requires API-Key:* **False**\n\n```python\nimport requests\ncomid = 5093446  # from snap_comid(lat, lon, flowlines); see src\u002fbuild\u002f_make_basins.py\nurl = f\"https:\u002f\u002fapi.water.usgs.gov\u002fnldi\u002flinked-data\u002fcomid\u002f{comid}\u002fbasin\"\nbasin = requests.get(url, params={\"f\": \"json\", \"simplified\": \"true\"}, timeout=60).json()\n```\n\nEvery basin parquet carries the outlet `comid` it was delineated from. basin3 (the D8 raster\nflood-fill, from the IWQIS 500 m direction raster) is the fourth delineation and the only one that\ntouches no NLDI service; it is a cross-check too, and carries no COMID.\n\nThe IWQIS KMZ basin layer (`iowawis.org\u002flayers\u002fbasins`) is **no longer used**. It supplied the old\n\"authoritative\" basin for WQS sites by scraping a PHP endpoint and score-matching candidate KMZs\nagainst the D8 area; the nearest-flowline snap supersedes it and gives a real COMID.\n\n### Deployment artifacts\n\nThe published widget has no server, so basins and covariates are precomputed for all 16,760 forecastable reaches:\n\n| Path | Size | Built by |\n|---|---|---|\n| `src\u002fdata\u002fraw\u002fbasins\u002fnldi\u002f` | 404 MB | `fetch_basins.py` — one NLDI polygon per COMID; quota-metered, so a refetch costs the better part of a day |\n| `src\u002fdata\u002fcache\u002freach_grids\u002f` | 464 MB | `build_reaches.py` — each basin's clipped grid cells |\n| `src\u002fdata\u002fcache\u002freach_rows\u002f` | 242 MB | `build_reaches.py` — each reach's aggregated feature row |\n\n`build_bundle.py` packs these into `widget\u002fassets\u002fdata\u002f` (~120 MB), which is what the browser fetches.\n\n### gridMET (additional daily weather data)\n- *Description:* Daily gridded weather at 4 km resolution. Includes max\u002fmin temp, humidity, VPD, solar radiation, ET, and 1000-hr fuel moisture. Used for all non-precipitation weather features.\n- *URL:* https:\u002f\u002fwww.climatologylab.org\u002fgridmet.html (served via the Northwest Knowledge Network THREDDS)\n- *Access Method:* `pygridmet` Python package (`get_bygeom`)\n- *Requires API-Key:* **False**\n- *Built to:* `src\u002fdata\u002finterim\u002fweather_global_{year}.parquet` — gridMET + IEM precip interpolated onto the canonical IEM grid, one row per `(date, global_node_id)`. This is a **built (interim)** table, not a raw snapshot; the raw gridMET NetCDF is cached under `src\u002fdata\u002fraw\u002fweather\u002fgridMET_raw\u002f`. (This is why the ~4.6 GB download goes in `interim\u002f`, not `raw\u002f`.)\n\n```python\nimport pygridmet\nds = pygridmet.get_bygeom(\n    geometry=(-97.6, 39.8, -89.5, 44.5),           # region bbox\n    dates=(\"2020-01-01\", \"2020-12-31\"),\n    variables=[\"pr\", \"tmmx\", \"tmmn\", \"rmax\", \"rmin\", \"vpd\", \"srad\", \"pet\", \"fm1000\"],\n)\n```\n\n### IEM — Iowa Environmental Mesonet (daily precip + the grid)\n- *Description:* Daily precipitation shapefiles that define the canonical IEM cell grid (`global_node_id`) and supply the `precip_in_1d` feature.\n- *URL:* https:\u002f\u002fmesonet.agron.iastate.edu\u002frainfall\u002fdshape.php\n- *Access Method:* HTTP download of a daily rainfall shapefile (read with GeoPandas)\n- *Requires API-Key:* **False**\n\n### USDA CDL \u002f CropScape (crop land cover)\n- *Description:* USDA Cropland Data Layer — annual 30 m crop classification, aggregated to the per-cell crop-fraction features.\n- *URL:* https:\u002f\u002fnassgeodata.gmu.edu\u002faxis2\u002fservices\u002fCDLService\u002fGetCDLFile\n- *Access Method:* HTTP GET → XML with a GeoTIFF URL → stream the raster (see `src.build.util.clip_crops`)\n- *Requires API-Key:* **False**\n\n```python\nimport requests, xml.etree.ElementTree as ET\nbbox = \"126000,1866000,340000,2270000\"  # EPSG:5070\nr = requests.get(f\"https:\u002f\u002fnassgeodata.gmu.edu\u002faxis2\u002fservices\u002fCDLService\u002fGetCDLFile?year=2020&bbox={bbox}\", timeout=300)\ntiff_url = ET.fromstring(r.content).find(\".\u002f\u002f{*}returnURL\").text\ntif = requests.get(tiff_url).content\n```\n\n### gTREND Surplus Data (Land-borne surplus nitrate data from 2000-2017)\n- *Description:* Surplus nitrate data at 250m resolution from a Nature paper. Access using instructions from the \"Data Records\" section of the paper. See also the section in `src\u002fREADME.md` on Catastrophic data rebuilding.\n- *URL:* https:\u002f\u002fwww.nature.com\u002farticles\u002fs41597-026-06576-x\n- *Access Method:* Manual download, tifs ingested from `src\u002fdata\u002fraw\u002fsurplus\u002ftif\u002f`.\n- *Requires API-Key:* **False**\n\n### US Census TIGER (state\u002fcounty boundaries — masking)\n- *Description:* Cartographic boundary shapefiles used to mask the region to Iowa when gridding surplus\u002fweather.\n- *URL:* https:\u002f\u002fwww2.census.gov\u002fgeo\u002ftiger\u002f\n- *Access Method:* HTTP download of a shapefile zip (read with GeoPandas)\n- *Requires API-Key:* **False**\n\n```python\nimport geopandas as gpd\nstates = gpd.read_file(\"https:\u002f\u002fwww2.census.gov\u002fgeo\u002ftiger\u002fGENZ2022\u002fshp\u002fcb_2022_us_state_20m.zip\")\n```\n\n### Natural Earth (rivers \u002f waterbodies — widget map overlays)\n- *Description:* 10 m physical rivers & lake centerlines for the widget's basemap overlays (display only, not a model feature).\n- *URL:* https:\u002f\u002fnaciscdn.org\u002fnaturalearth\u002f10m\u002fphysical\u002fne_10m_rivers_lake_centerlines.zip\n- *Access Method:* HTTP download of a shapefile zip\n- *Requires API-Key:* **False**\n\n```python\nimport geopandas as gpd\nrivers = gpd.read_file(\"https:\u002f\u002fnaciscdn.org\u002fnaturalearth\u002f10m\u002fphysical\u002fne_10m_rivers_lake_centerlines.zip\")\n```\n\n# Data Story\n\nHere's a writeup documenting our thought process as we identified and consolidated our data.\n\n## Target\n\nThe two main targets are derived from a collection of 162 water-borne nitrate sensors spread out across Iowa's hydrological network recording nitrate (NO2 + NO3) concentration measurements (mg\u002fL) in 5-15 minute intervals. Each of these sensors began reporting at a different date between 2008 and 2025, and many sensors were decommissioned. There are also significant data gaps in most of the nitrate timeseries in which a sensor was turned off for a time (or malfunctioned and was replaced) before being turned back on again. This means the quality of these timeseries varies significantly from sensor to sensor -- some are mostly NaN, some span time periods of 1 year.\n\nTo standardize and clean the data we filtered out sites that had a NaN reporting rate above 50% or a total lifespan of under 3.92 years (3.92 was chosen because there was one sensor with high-quality data we liked a lot). We then manually scanned through the timeseries plots of the remaining sensors and threw away the ones which were clearly garbage (those reporting a perfectly linear nitrate concentration over their entire lifespan, for instance). This left us with 85 sensors.\n\nWe later dropped two more — `USGS-415959091441301` (an NWIS well) and `WQS0031` (Big Spring, whose IWQIS `river` field reads \"Groundwater \u002f Spring\") — because they are groundwater sites with no surface drainage basin, so the basin delineation, the distance-bucketed covariate aggregation and the surface travel-time lags are all meaningless for them. **83 sensors** is the working set (the models train on 81 — two fall short on rows once the features are built).\n\nFrom these nitrate timeseries, we define two targets: a regression target given by the daily max nitrate value observed by a sensor and a classification target given by the violation category of a sensor. A \"violation\" is defined by the EPA as a nitrate concentration above 10 mg\u002fL (though in reality levels far below this are still unsafe for human consumption), so in the latter case the target is \"1\" if the daily maximum nitrate level rose above 10 mg\u002fL and is \"0\" otherwise.\n\nSensor data came from two different sources depending on whether the sensors were state or federally operated:\n- IWQIS (Iowa Water Quality Information System) sensors: Jerry from the IWQIS gave us a 3.3 GB CSV containing the sensor timeseries for 60\u002f83 of our final sites.\n- USGS NWIS (National Water Information System) sensors: 23\u002f83 final sensors come from federally operated sites, and were downloaded via API requests.\n\n\n## Covariates\n\nWater-borne nitrate comes from a variety of sources, but the primary source is agricultural. Many crops, notably corn, require copious nitrogen input into the soil. Excess nitrogen in the soil then leaches into the watershed, largely through precipitation, where some of it flows into the path of a nitrate sensor. Given this, we chose the following as our primary covariates:\n\n- *Crop Distribution*, calculated yearly via satellite imagery from 2000 - 2025. Accessed using the USDA Cropland Data Layer to produce GeoTIFFs, where each pixel corresponds to one of 254 different land-use types (Corn, Soybeans, Nonag, etc.) at a resolution of 30m x 30m. We refer to this as the *crop data*.\n- *Nitrogen Surplus 2000-2017*, a model of yearly average nitrogen surplus in the continental United States from 1930-2017 (we use 2000 onward), calculated via the gTREND model in the 2026 Nature paper [gTREND-Nitrogen - Long-term nitrogen mass balance data for the contiguous United States (1930-2017)](https:\u002f\u002fwww.nature.com\u002farticles\u002fs41597-026-06576-x). One massive GeoTIFF downloaded manually for each year. We refer to this as the *surplus data*.\n- *Daily Historical Weather*, precipitation in inches from IEM and then min\u002fmax temperature in Celsius, min\u002fmax humidity, vapor pressure deficit, evapotranspiration (mm), solar radiation in Joules and 1000-hr fuel moisture from gridMET. We refer to this as the *weather data*.\n\nOther features we considered but decided against:\n- *SSURGO*, detailed static soil information for the United States. Hard to organize, and preliminary EDA showed it had little effect on model performance.\n- *OpenET Database*, a wonderful dataset with detailed evapotranspiration data. We already had rudimentary ET from gridMET, and the difficulty of incorporating another datastream outweighed the accuracy it might have bought.\n- *Point source polluters*. Discrete sources like slaughterhouses and pig farms feed a roughly constant stream of nitrogen into certain Iowa rivers. We couldn't find a single good data source for them, but think these features would be the single-best model improvement available.\n- *USDA LTAR*: 19 USDA-affiliated research stations. Publicly accessible in theory; in practice each site has its own mechanism for finding and downloading data. There are likely useful features hiding here, but we couldn't surface any.\n- *NASA SMAP*: soil moisture every 2-3 days at 9 km. We skipped it in EDA, then found during training that 1000-hr fuel moisture — a tag-along fire-hazard indicator in the weather data — measurably improved our models, presumably as a proxy for long-term soil hydrology, which governs how nitrogen moves from soil to water. Too late for this version; an obvious addition to the next.\n- *USDA NASS Quickstats*: yield, harvested area, production volume, fertilizer sales, irrigated area. Hard to access, much of it in PDF reports, and collected on an unpredictable schedule. An ambitious scraper could probably find categorical labels and fertilizer proxies in here.\n- *Additional live sensor features*: the sensors also report pH, oxygenation, flow rate and more, but which ones vary widely by site. Useful if you first filtered the monitoring locations down to those reporting the feature you want.\n\n## Organization of the Data\n\nTwo peculiarities drove our data organization. First, the only pollutants which can possibly contribute to the reading of nitrate sensors deployed in water are those directly upstream of the sensor. This means that the area relevant to a given sensor is the *drainage basin* of the sensor, defined as the set of points directly upstream from the sensor. Second, our crop, surplus and weather data exist on rectangular grids at resolutions of 30m, 250m and 4km respectively. Part of our data cleaning necessarily included, therefore, the calculation of the drainage basins for each sensor and the reconciliation of these three different grids (details on this in the following two subsections). After this process we had, associated to each of our 83 deployed monitoring sites,\n\n- a *basin* parquet, encoding the geometry of the sensor's drainage basin\n- a *grid* parquet, data concerning the portion of the weather grid falling inside the sensor's basin, used for joining crop, surplus and weather datasets within a site as well as joining individual basin datasets together\n- a *crop* parquet containing all crop data inside a site's basin aggregated to the weather grid\n- a *surplus* parquet containing all surplus data inside a site's basin aggregated to the weather grid\n- a *weather* parquet containing a daily timeseries of all weather data from the start to end of a sensor's lifetime, buffered on either end by 2 months and aligned to the weather grid natively\n- a *water* parquet containing the 5-15 minute frequency nitrate concentration timeseries along with other quantities inconsistently tracked across sites.\n\n### Basin Calculation\n\nIrrelevant\u002frelevant area erroneously included\u002fexcluded from a drainage basin could severely limit model performance, hence every other piece of this project was downstream of the drainage basin calculation (get it?). We spent a fair amount of time on this step as we wanted to ensure the ceiling for our model's capabilities was as high as possible. There were three different methods we used to find these drainage basins, and each had its own failure mode:\n\n1. *snap to reference*: use a USGS API to look up precomputed drainage basins by snapping the GPS coordinates of a sensor to the nearest reference point. This worked well for most sites, but failed horribly for sensors placed on small streams near intersections with major rivers: in the worst cases this led to the drainage basin of a small local sensor incorrectly including all of Montana.\n2. *authority lookup*: use the unique identifier of a site (its so-called `site_uid`) to look up the drainage basin directly from either a federal or state authority. This worked quite well for every USGS site but quite badly for the IWQIS sites.\n3. *compute the basin algorithmically*: the IWQIS monitoring site provides a feature for displaying a drainage basin for an arbitrary pin drop on the map, and it almost works. It runs client-side in JavaScript, so we used Claude to scrape through the site source and reconstruct the algorithm (it uses a GeoTIFF aligned to a reference grid with the direction of flow at every cell rounded to one of the 8 cardinal directions, and then finds a basin by flooding upstream from the outlet breadth-first, one frontier at a time).\n\nWe then went through and manually selected a basin for each site using one of these three methods, defaulting to 1 and 2 and only resorting to 3 when the other two were nonsensical. After this process there were *still* four sites with basins which included large amounts of downstream area or failed to include the sensor location itself. These four sites were all state operated, so we used either 1 or 3 to calculate basins for pins dropped near the offending locations and then chose those basins which seemed most reasonable and\u002for most closely matched the one displayed by IWQIS. At the end of this process we doubted the supposed irrefutability of the IWQIS basins, and think that ours might be marginally more accurate.\n\nThe manually chosen preference basins were locked in to a read-only csv and not changed over the course of the project.\n\n### Grid Reconciliation\n\nThe weather grid was far larger than either the surplus or crop grids, so the obvious approach here was to snap surplus and crop cells to the nearest weather cell and then aggregate. Unfortunately, the weather grid didn't align to latitude and longitude lines; it was slightly curved, meaning every edge partitioned the cells of the other two grids. This didn't matter for the crop grid (30m\u002f4km resolution ratios), but could have led to nontrivial error in the surplus aggregation.\n\nWe first calculated the Voronoi cells for the weather reporting locations. Then we aggregated the surplus data to the weather grid weighted by the area of intersection of surplus grid cells and the weather Voronoi cells, made possible by the GeoPandas and Shapely Python packages.\n\nThe aggregation was easier for crops; we simply summed the total number of pixels of each CDL category in each weather grid cell. To avoid keeping all 254 categories, many of which were redundant (Corn, Sweet Corn, and Pop Corn are all separate categories) we applied an intermediate filter to combine categories. Our final crop category list is eight classes: \"Corn\", \"Soybeans\", \"Alfalfa\", \"Hay_Pasture\", \"Small_Grains\", \"Fallow\", \"Nonag\" (catch all for ~0 Nitrogen contributors) and \"Other\" for all CDL categories not directly addressed.\n\nAt the end of this we had a global weather grid parquet with corresponding grid-aggregated crop and surplus files. We additionally included one grid file per monitoring location containing the portion of the weather grid covering the site's drainage basin. Each of these site-grid files included the fraction of area of each cell contained in the basin as well as an estimate of the distance from the centroid of each cell to the sensor, calculated using an algorithm adapted from the resources in basin-calculation-method (3) above.","links":"# Links\n\n## Code\n\n- **[Project repository](https:\u002f\u002fgithub.com\u002fErdos-Projects\u002fsummer26-sustainability-of-agriculture)** — everything behind this site: the data pipeline, the models, and the widget itself.\n- **[Ongoing work](https:\u002f\u002fgithub.com\u002fikmartin\u002fsustag)** — the fork where development continues, aimed at deploying robust virtual sensor models on a dedicated server, intended specifically to supplement the live, in-situ nitrate detectors deployed across the continental United States.\n\n## This tool\n\n- **[Live widget](https:\u002f\u002ferdos-projects.github.io\u002fsummer26-sustainability-of-agriculture\u002f)** — the page you are on, if you want to send someone the link.\n- **[Presentation video](https:\u002f\u002fwww.youtube.com\u002fwatch?v=O_ZCylQCXe8)** — five minutes on the problem and the approach. Also embedded under *Presentation*.\n\n## Data sources\n\n- **[IWQIS](https:\u002f\u002fiwqis.iowawis.org\u002f)** — Iowa Water Quality Information System, source of the `WQS*` nitrate sensors and the inspiration for this widget's design.\n- **[USGS NLDI](https:\u002f\u002fapi.water.usgs.gov\u002fnldi\u002flinked-data)** — the hydrologic network navigation service behind every drainage basin here, and [NWIS](https:\u002f\u002fapi.waterdata.usgs.gov\u002f) for the `USGS-*` gauges.\n- **[gridMET](https:\u002f\u002fwww.climatologylab.org\u002fgridmet.html)** — daily gridded weather.\n- **[USDA Cropland Data Layer](https:\u002f\u002fnassgeodata.gmu.edu\u002fCropScape\u002f)** — annual 30 m crop classification.\n- **[gTREND](https:\u002f\u002fwww.nature.com\u002farticles\u002fs41597-026-06576-x)** — the long-term nitrogen mass balance dataset providing the soil surplus layer.\n\nFull access details for every source, including which builder script consumes it, are under *Data inventory*.\n\n## Video that inspired this project\n\n- **[Iowa's Cancer Rate is Skyrocketing. Our Tests Prove Why](https:\u002f\u002fwww.youtube.com\u002fwatch?v=AmiwQoxFNJw)**. We wanted to study sustainable agriculture, one of our team members found this video, and the project was born."},"mathjax":{"about":false,"video":false,"summary":false,"kpis":true,"data":false,"links":false},"embed":{"about":null,"video":"https:\u002f\u002fwww.youtube-nocookie.com\u002fembed\u002fO_ZCylQCXe8","summary":null,"kpis":null,"data":null,"links":null},"links":{"executive_summary.md":"summary","kpis.md":"kpis","data_inventory.md":"data"},"repo_blob":"https:\u002f\u002fgithub.com\u002fErdos-Projects\u002fsummer26-sustainability-of-agriculture\u002fblob\u002fmain\u002f"}},"type":"Store","namespace":"dash_core_components"},{"props":{"id":"docs-active","data":null},"type":"Store","namespace":"dash_core_components"},{"props":{"children":[{"props":{"children":"☰","className":"docs-open-icon"},"type":"Span","namespace":"dash_html_components"},{"props":{"children":"About this project"},"type":"Span","namespace":"dash_html_components"}],"id":"docs-open-btn","className":"docs-open-btn","n_clicks":0,"title":"About this project"},"type":"Button","namespace":"dash_html_components"},{"props":{"children":[{"props":{"children":null,"id":"docs-backdrop","className":"docs-backdrop","n_clicks":0},"type":"Div","namespace":"dash_html_components"},{"props":{"children":[{"props":{"children":[{"props":{"children":"Virtual nitrate sensors for Iowa","className":"docs-title
